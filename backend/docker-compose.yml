version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: bravo-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: bravo-music
    volumes:
      - mongodb_data:/data/db
      - ./backups:/backups
    networks:
      - bravo-network

  redis:
    image: redis:7-alpine
    container_name: bravo-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - bravo-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bravo-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:${MONGO_ROOT_PASSWORD}@mongodb:27017/bravo-music?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    networks:
      - bravo-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bravo-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - bravo-network

  nginx:
    image: nginx:alpine
    container_name: bravo-nginx
    restart: always
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./config/nginx/bravo-music.conf:/etc/nginx/conf.d/default.conf
      - ./config/nginx/ssl.conf:/etc/nginx/ssl.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - frontend
    networks:
      - bravo-network

networks:
  bravo-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data: