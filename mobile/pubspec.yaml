name: bravo_music
description: Bravo Music Mobile App - Zambia's Premier Music Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.7
  
  # State Management
  provider: ^6.0.5
  riverpod: ^2.3.6
  
  # Networking
  dio: ^5.3.2
  socket_io_client: ^2.0.3
  
  # Audio
  audioplayers: ^5.2.1
  just_audio: ^0.9.35
  
  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Authentication
  flutter_secure_storage: ^9.0.0
  
  # Payments
  flutter_webview_plugin: ^0.4.0
  
  # Notifications
  firebase_messaging: ^14.6.5
  flutter_local_notifications: ^15.1.1
  
  # Analytics
  firebase_analytics: ^10.6.4
  
  # Utilities
  intl: ^0.18.1
  url_launcher: ^6.1.14
  share_plus: ^7.2.1
  image_picker: ^1.0.4
  file_picker: ^5.5.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.6
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300