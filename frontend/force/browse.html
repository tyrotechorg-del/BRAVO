<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Music - Bravo Music</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Same navbar as index.html -->
    <nav class="navbar"><div class="nav-container"><!-- Same navbar content --></div></nav>
    
    <main style="margin-top: 80px;">
        <div class="section">
            <h1>Browse Music</h1>
            <div class="genre-filters" style="display: flex; gap: 10px; margin: 20px 0; flex-wrap: wrap;">
                <button class="genre-filter active" data-genre="all">All</button>
                <button class="genre-filter" data-genre="Afrobeat">Afrobeat</button>
                <button class="genre-filter" data-genre="Amapiano">Amapiano</button>
                <button class="genre-filter" data-genre="Hip Hop">Hip Hop</button>
                <button class="genre-filter" data-genre="Gospel">Gospel</button>
                <button class="genre-filter" data-genre="Kalindula">Kalindula</button>
            </div>
            <div class="songs-grid" id="browse-grid"></div>
            <div class="pagination" id="pagination"></div>
        </div>
    </main>
    
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
    <script>
        let currentPage = 1;
        let currentGenre = 'all';
        
        async function loadSongs() {
            const result = await SongsAPI.getAll(currentPage, 20, currentGenre);
            const songs = result.songs || [];
            const grid = document.getElementById('browse-grid');
            grid.innerHTML = '';
            songs.forEach(song => {
                grid.appendChild(createSongCard(song, (s) => Toast.show(`Now playing: ${s.title}`, 'success')));
            });
        }
        
        document.querySelectorAll('.genre-filter').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.genre-filter').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentGenre = btn.dataset.genre;
                loadSongs();
            });
        });
        
        loadSongs();
        initNavbar();
    </script>
</body>
</html>
