<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Bravo Music</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar"><div class="nav-container"><!-- Same navbar content --></div></nav>
    
    <div class="form-container">
        <h2>Create Account</h2>
        <form id="register-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullname" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <div class="form-group">
                <label>Account Type</label>
                <select id="role">
                    <option value="listener">Listener - Enjoy Music</option>
                    <option value="artist">Artist - Upload & Earn</option>
                </select>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%;">Create Account</button>
        </form>
        <p class="form-footer">Already have an account? <a href="login.html">Login</a></p>
    </div>
    
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roleParam = urlParams.get('role');
        if (roleParam === 'artist') document.getElementById('role').value = 'artist';
        
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const userData = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                fullName: document.getElementById('fullname').value,
                password: document.getElementById('password').value,
                role: document.getElementById('role').value
            };
            
            try {
                await AuthAPI.register(userData);
                Toast.show('Registration successful!', 'success');
                setTimeout(() => {
                    if (userData.role === 'artist') window.location.href = 'artist-dashboard.html';
                    else window.location.href = 'index.html';
                }, 1000);
            } catch (error) {
                Toast.show(error.message, 'error');
            }
        });
        initNavbar();
    </script>
</body>
</html>
