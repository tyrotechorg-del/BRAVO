<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bravo Music</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar"><div class="nav-container"><!-- Same navbar content --></div></nav>
    
    <div class="form-container">
        <h2>Login to Bravo Music</h2>
        <form id="login-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••">
            </div>
            <button type="submit" class="btn-primary" style="width: 100%;">Login</button>
        </form>
        <p class="form-footer">Don't have an account? <a href="register.html">Register</a></p>
        <p class="demo-note" style="text-align: center; margin-top: 20px; font-size: 12px; color: var(--text-secondary);">Demo: demo@example.com / password123</p>
    </div>
    
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                await AuthAPI.login(email, password);
                Toast.show('Login successful!', 'success');
                setTimeout(() => {
                    const user = API.getUser();
                    if (user?.role === 'admin') window.location.href = 'admin-dashboard.html';
                    else if (user?.role === 'artist') window.location.href = 'artist-dashboard.html';
                    else window.location.href = 'index.html';
                }, 1000);
            } catch (error) {
                Toast.show(error.message, 'error');
            }
        });
        initNavbar();
    </script>
</body>
</html>
