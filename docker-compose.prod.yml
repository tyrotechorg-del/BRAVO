version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: bravo-mongodb-prod
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: bravo-music
    volumes:
      - mongodb_data_prod:/data/db
      - ./backups:/backups
    networks:
      - bravo-network-prod
    command: mongod --replSet rs0 --bind_ip_all

  redis:
    image: redis:7-alpine
    container_name: bravo-redis-prod
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data_prod:/data
    networks:
      - bravo-network-prod

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: bravo-backend-prod
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/bravo-music?authSource=admin&replicaSet=rs0
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    networks:
      - bravo-network-prod

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: bravo-frontend-prod
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - bravo-network-prod

  nginx:
    image: nginx:alpine
    container_name: bravo-nginx-prod
    restart: always
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./config/nginx/bravo-music.conf:/etc/nginx/conf.d/default.conf
      - ./config/nginx/ssl.conf:/etc/nginx/ssl.conf
      - ./ssl:/etc/nginx/ssl
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - bravo-network-prod

networks:
  bravo-network-prod:
    driver: bridge

volumes:
  mongodb_data_prod:
  redis_data_prod: